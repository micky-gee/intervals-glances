name = "intervals-oauth"
main = "oauth-exchange.js"
compatibility_date = "2026-07-01"

[vars]
# Public values only. NEVER put the client secret here - this file is
# committed. Set it with: wrangler secret put INTERVALS_CLIENT_SECRET
INTERVALS_CLIENT_ID = "649"
# Must match the redirect the watch sends. Garmin Connect Mobile requires
# http://localhost for Communications.makeOAuthRequest (it intercepts that
# navigation), so the authorize and token calls both use it.
REDIRECT_URI = "http://localhost"
